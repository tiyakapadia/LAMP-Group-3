<!DOCTYPE html>
<html>
<head>
    <title>Personal Contact Manager</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
<body class="home-body">

    <!--Header-->
    <header>
        <h1 class="homepage-title">Personal Contact Manager</h1>
        <button class="nav-button" onclick="doLogout()">Logout</button>
    </header>

    <!--Navigation-->
    <nav>
        <button class="nav-button">Dashboard</button>
        <button class="nav-button" onclick="document.getElementById('searchInput').focus();">Search Contacts</button>
        <button class="nav-button" onclick="document.getElementById('addName').focus();">Add Contact</button>
    </nav>

    <!--Main Content-->
    <main>
        
    
        <section class="vibe-hero">
            
            <div class="vibe-hero-left">
                <div class="vibe-overline">Personal Dashboard</div>
                <!-- The JS will inject the name here, and CSS will force it HUGE and UPPERCASE -->
                <h2 id="welcomeMessage" class="vibe-title">WELCOME BACK</h2>
                <div class="vibe-line"></div>
            </div>

            <div class="vibe-hero-right">
                <div class="vibe-card">
                    <h3>Account Status</h3>
                    <p style="color: #ccc; line-height: 1.6;">
                        You are currently authenticated and logged in as 
                        <span id="username" class="gold-text"></span>.
                    </p>
                    <p style="color: #ccc;">
                        System User ID: <span id="userId" class="gold-text"></span>
                    </p>
                </div>
            </div>

        </section>


        <!--Search Contacts-->
        <section class="content-panel">
            <h2>Search Contacts</h2>
            <input id="searchInput" class="search-box" type="text" placeholder="Search by name...">
            <button class="nav-button" onclick="doSearch()">Search</button>
            <p id="searchMessage" style="color: red;"></p>
            
            <table id="contactsTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="contactsBody">
                </tbody>
            </table>
        </section>


        <!--Add Contact-->
        <section class="content-panel">
            <h2>Add New Contact</h2>
            <label>Full Name</label><br>
            <input id="addName" class="search-box" type="text"><br><br>
            
            <label>Phone Number</label><br>
            <input id="addPhone" class="search-box" type="text"><br><br>
            
            <label>Email Address</label><br>
            <input id="addEmail" class="search-box" type="email"><br><br>

            <label style="cursor: pointer; color: #BA9B37; font-weight: bold;">
                <input type="checkbox" id="addFavorite" style="margin-right: 8px; transform: scale(1.2);">
                Mark as VIP / Favorite
            </label>
            <br><br>

            <button class="nav-button" onClick="addContact()">Add Contact</button>
            <p id="addMessage" style="margin-top: 15px;"></p>
        </section>


        <!-- Edit Contact -->
        <div id="editModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;">
            <div class="content-panel" style="width: 400px; margin: 10% auto; position: relative;">
                <h2>Edit Contact</h2>
                
                <input type="hidden" id="editId">
                
                <label>Name</label><br>
                <input id="editName" class="search-box" type="text"><br><br>
                
                <label>Phone</label><br>
                <input id="editPhone" class="search-box" type="text"><br><br>
                
                <label>Email</label><br>
                <input id="editEmail" class="search-box" type="email"><br><br>

                <label style="cursor: pointer; color: #BA9B37;">
                    <input type="checkbox" id="editFavorite" style="margin-right: 8px; transform: scale(1.2);">
                    Mark as VIP / Favorite
                </label><br><br>

                <button class="nav-button" onclick="saveEdit()">Save Changes</button>
                <button class="delete-button" onclick="closeEditModal()">Cancel</button>
            </div>
        </div>

    </main>
</body>
</html>
